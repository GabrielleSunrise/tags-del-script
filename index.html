<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Очиститель HTML-тегов</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

        <div class="container">
            <h1>Очиститель HTML</h1>

            <label for="inputHtml">Вставьте текст с HTML-тегами:</label>
            <textarea id="inputHtml" rows="10" placeholder="Вставьте сюда ваш HTML-текст..."></textarea>

            <div class="btn-stack">
                <button id="cleanButton" class="btn-main">Удалить все теги</button>
                <button id="makeBeautifulBtn" class="btn-main">✨ СДЕЛАТЬ КРАСИВО (удалить всё ненужное, для чужого html)</button>

                <div class="btn-row-3">
                    <button id="cleanEmptyButton" class="btn-secondary">Удалить пустые теги</button>
                    <button id="removeScriptsBtn" class="btn-secondary">Удалить скрипты</button>
                    <button id="removeCommentsBtn" class="btn-secondary">Удалить комментарии</button>
                </div>
                <button id="wrapBrButton" class="btn-secondary btn-wide">Обернуть текст, разделённый &lt;br&gt;, в &lt;p&gt;</button>
            </div>

            <div class="section-title">Убрать атрибуты</div>
            <div class="attr-group">
                <button id="removeClassBtn" class="btn-mini">class</button>
                <button id="removeIdBtn" class="btn-mini">id</button>
                <button id="removeDataBtn" class="btn-mini">data-*</button>
                <button id="removeStyleBtn" class="btn-mini">style</button>
                <button id="removeEventsBtn" class="btn-mini">onclick и т. п.</button>
            </div>

            <div style="margin-top: 30px;">
                <label for="outputCleaned">Результат:</label>
                <textarea id="outputCleaned" rows="10" readonly placeholder="Здесь появится очищенный текст..."></textarea>
                <div class="copy-footer">
                    <button class="btn-copy" onclick="copyToClipboard('outputCleaned', this)">Копировать результат</button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
